[project]
name = "incidentforge"
version = "0.1.0"
description = "AI incident investigation and verified recovery platform (controlled research setting)"
requires-python = ">=3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["integration: requires the running docker compose stack", "db: requires PostgreSQL (TEST_ADMIN_DSN)", "live: calls a real LLM provider"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "BLE"]
ignore = ["S101", "S104"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency markers are designed to be used as argument defaults.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Header", "forge.api.deps.require"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "B", "BLE"]
# Operator tools: URLs come from CLI args; seeded PRNGs are for reproducible synthetic load.
"tools/**" = ["S310", "S311"]
"scripts/**" = ["S310", "S603", "S607"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
warn_unused_ignores = false
