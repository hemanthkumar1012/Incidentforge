global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: shop
    metrics_path: /metrics
    static_configs:
      - targets: ["checkout:8000"]
        labels: { app: shop, component: checkout }
      - targets: ["inventory:8001"]
        labels: { app: shop, component: inventory }
      - targets: ["payment:8002"]
        labels: { app: shop, component: payment }
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
